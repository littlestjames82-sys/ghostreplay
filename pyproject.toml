[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostreplay"
version = "0.1.0"
description = "Agent session learner for GhostSlice: analyses local Claude Code transcripts against Slice bundles, proposes profile improvements with evidence (propose-only)"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "tokens", "context", "claude-code", "agents", "ghostslice"]
dependencies = []

[project.scripts]
ghostreplay = "ghostreplay.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
